<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Black goese bistro | Pizza-on-Demand</h1>
    <p>
        Selamat datang di Black Goose Bistro, tempat terbaik untuk memesan pizza sesuai keinginan Anda! Silakan isi formulir di bawah ini untuk membuat pesanan pizza impian Anda.
    </p>

    <form action="sukses.html" method="post">
        <fieldset>
            <legend>Your Information</legend>
            <label for="customername">Name: </label>
            <input type="text" id="customername" name="customername" required>
        <p>
            <label for="address">Address: </label>
            <input type="text" id="address" name="address">
        </p>

        <p>
            <label for="telephone">Phone: </label>
            <input type="text" id="telephone" name="telephone" required>
        </p>

        <p>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="Instruction">Delivery Instruction:</label><br>
            <textarea
            id="instruction"
            name="instruction"
            rows="4"
            cols="50"
            maxlength="400"
            placeholder="no more than 400 characters."
            required></textarea>
        </p>
        </fieldset>

        <fieldset>
            <legend>Design your dream pizza</legend>
            <p>Pizza Specs</p>
            <p>Pilih 1:</p>

            <p>
                <input type="radio" id="classic"name="crust"
                value="classic white" required>
                <label for="classic">Classic White</label><br>

                <input type="radio" id="thin"name="crust"
                value="thin crust" required>
                <label for="thin">Thin Crust</label><br>

                <input type="radio" id="deep"name="crust"
                value="deep dish" required>
                <label for="deep">Deep Dish</label><br>

                <input type="radio" id="gluten"name="crust"
                value="gluten free" required>
                <label for="gluten">Gluten Free</label><br>
            </p>

            <p>toping</p>

            <p>
                <input type="checkbox" id="pepperoni" name="toppings"
                value="pepperoni">
                <label for="pepperoni">Pepperoni</label><br>

                <input type="checkbox" id="mushroom" name="toppings"
                value="mushroom">
                <label for="mushroom">Mushroom</label><br>

                <input type="checkbox" id="onion" name="toppings"
                value="onion">
                <label for="onion">Onion</label><br>

                <input type="checkbox" id="sausage" name="toppings"
                value="sausage">
                <label for="sausage">Sausage</label><br>

                <input type="checkbox" id="bacon" name="toppings"
                value="bacon">
                <label for="bacon">Bacon</label><br>

                <input type="checkbox" id="extraCheese" name="toppings"
                value="extra cheese">
                <label for="extraCheese">Extra Cheese</label><br>

                <input type="checkbox" id="greenPeppers" name="toppings"
                value="green peppers">
                <label for="greenPeppers">Green Peppers</label><br>
            
            </p>

            <p>
                <label for="pizzas">Quantity:</label>
                <input type="number" id="pizzas" name="pizzas" min="1" max="10" value="1">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
